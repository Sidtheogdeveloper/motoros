name: Verify MotorOS Milestone 6
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: mvn -B verify
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/env.mjs
      - run: node tests/integration/fresh-compose.mjs
      - run: node tests/integration/cloud-migrations.mjs
      - run: npm run infra
      - run: npm run storage:configure
      - run: node scripts/run-services.mjs > .runtime/services.log 2>&1 &
      - run: node scripts/wait.mjs 8081 8082 8083 8084 8085 8086 8087 8088
      - run: node scripts/frontend.mjs --production > .runtime/frontend.log 2>&1 &
      - run: node scripts/wait.mjs 3000
      - run: MOTOROS_DEV_FIXTURES=1 npm run fixtures
      - run: MOTOROS_DEV_FIXTURES=1 npm run fixtures:m3
      - run: MOTOROS_EXPECT_ASYNC_APPROVAL=1 npm run test:api
      - run: MOTOROS_DEV_FIXTURES=1 npm run test:api:m6
      - run: MOTOROS_FAILURE_TESTS=1 npm run test:reliability
      - run: npm run test:e2e
      - run: npm run test:secrets
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
      - run: terraform -chdir=infrastructure/terraform/cognito fmt -check
      - run: terraform -chdir=infrastructure/terraform/cognito init -backend=false
      - run: terraform -chdir=infrastructure/terraform/cognito validate
      - run: terraform -chdir=infrastructure/terraform/messaging fmt -check
      - run: terraform -chdir=infrastructure/terraform/messaging init -backend=false
      - run: terraform -chdir=infrastructure/terraform/messaging validate
      - if: always()
        run: docker compose down
