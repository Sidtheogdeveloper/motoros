[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "motoros-intelligence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.17,<2",
  "boto3>=1.40,<2",
  "fastapi>=0.120,<1",
  "httpx>=0.28,<1",
  "opentelemetry-api>=1.40,<2",
  "psycopg[binary]>=3.3,<4",
  "pydantic>=2.12,<3",
  "pypdf>=6.21.4,<7",
  "sqlalchemy>=2.0.45,<2.1",
  "uvicorn>=0.38,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]


[tool.setuptools.packages.find]
include = ["motoros_ai*"]
