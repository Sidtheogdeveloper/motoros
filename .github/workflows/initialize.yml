name: Initialize private database roles and runtime secrets
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: motoros-cloud-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  authorized:
    if: github.ref == 'refs/heads/main'
    environment: ${{ inputs.environment }}-initialize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Materialize nonsecret reviewed configuration
        env:
          CONFIG_JSON: ${{ vars.MOTOROS_CONFIG_JSON }}
          DEPLOYMENT_JSON: ${{ vars.MOTOROS_DEPLOYMENT_JSON }}
        run: |
          mkdir -p .runtime
          node -e 'const fs=require("fs");for(const [n,v] of [["cloud-config",process.env.CONFIG_JSON],["deployment",process.env.DEPLOYMENT_JSON]])fs.writeFileSync(".runtime/"+n+".json",JSON.stringify(JSON.parse(v)),{mode:0o600})'
      - run: node infrastructure/scripts/cloud.mjs preflight .runtime/cloud-config.json
      - name: Run private initialization task while applications remain stopped
        env:
          MOTOROS_DEPLOY_AUTHORIZATION: ${{ inputs.environment }}
        run: node infrastructure/scripts/cloud.mjs initialize .runtime/cloud-config.json .runtime/deployment.json
